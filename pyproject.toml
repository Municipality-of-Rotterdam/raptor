[project]
name = "raptor"
version = "3.0.0"
requires-python = ">=3.11"
dependencies = [
    "pre-commit==2.19.0",
    "copier>=9.0.0"
]

[tool.uv]
package = false

[dependency-groups]
test = [
    "wheel",
    "uv>=0.10.0",
    "pylint==2.13.8",
    "pyyaml",
    "pytest==7.1.2",
    "pytest-cov",
]

[tool.mypy]
ignore_missing_imports = true
