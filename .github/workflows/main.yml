name: Raptor CICD

env:
  PYTHON_VERSION: '3.11'                  # set this to the Python version to use

on:
  push:
    branches:
      - main
      - release/*
      - develop
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  Precommit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run pre-commit on raptor repo
        run: |
          cd ${{ github.workspace }}
          uv run pre-commit run --all-files --show-diff-on-failure

  Create_and_test_package_repo:
    name: Create package repo and run pre-commit
    needs: [Precommit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create test repo with copier (DevOps variant)
        run: |
          cd ${{ github.workspace }}
          uv run copier copy -d repo_type=package_repo -d ci_cd=DevOps -d package_name=package_name_ado -d user_name="Ci Cd" -d user_email=cicd@devops.com -f --vcs-ref HEAD --trust . ..

      - name: Run pre-commit in test repo (DevOps variant)
        run: |
          cd ${{ github.workspace }}/pkg_package_name_ado
          uv run --group precommit pre-commit run --all-files --show-diff-on-failure

      - name: Run pytest in test repo (DevOps variant)
        run: |
          cd ${{ github.workspace }}/pkg_package_name_ado
          uv run --group test pytest tests --doctest-modules --junitxml=junit/test-results.xml --cov=. --cov-config=.coveragerc_pipeline --cov-report=xml --cov-report=html -m "not onlylocal"

      - name: Create test repo with copier (Github variant)
        run: |
          cd ${{ github.workspace }}
          uv run copier copy -d repo_type=package_repo -d ci_cd=GitHub -d package_name=package_name_gh -d user_name="Ci Cd" -d user_email=cicd@devops.com -f --vcs-ref HEAD --trust . ..

      - name: Run pre-commit in test repo (Github variant)
        run: |
          cd ${{ github.workspace }}/pkg_package_name_gh
          uv run --group precommit pre-commit run --all-files --show-diff-on-failure

      - name: Run pytest in test repo (Github variant)
        run: |
          cd ${{ github.workspace }}/pkg_package_name_gh
          uv run --group test pytest tests --doctest-modules --junitxml=junit/test-results.xml --cov=. --cov-config=.coveragerc_pipeline --cov-report=xml --cov-report=html -m "not onlylocal"

  Create_and_test_project_repo:
    name: Create project repo and run pre-commit
    needs: [Precommit, Create_and_test_package_repo]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create test repo with copier (DevOps variant)
        run: |
          cd ${{ github.workspace }}
          uv run copier copy -d repo_type=project_repo -d ci_cd=DevOps -d project_name=project_name_ado -d user_name="Ci Cd" -d user_email=cicd@devops.com -f --vcs-ref HEAD --trust . ..

      - name: Run pre-commit in test repo (DevOps variant)
        run: |
          cd ${{ github.workspace }}/project_name_ado
          uv run --group precommit pre-commit run --all-files --show-diff-on-failure

      - name: Create test repo with copier (Github variant)
        run: |
          cd ${{ github.workspace }}
          uv run copier copy -d repo_type=project_repo -d ci_cd=GitHub -d project_name=project_name_gh -d user_name="Ci Cd" -d user_email=cicd@devops.com -f --vcs-ref HEAD --trust . ..

      - name: Run pre-commit in test repo (Github variant)
        run: |
          cd ${{ github.workspace }}/project_name_gh
          uv run --group precommit pre-commit run --all-files --show-diff-on-failure
