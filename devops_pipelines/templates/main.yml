variables:
  - template: /devops_pipelines/templates/config.yml
  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  - name: isDev
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/develop')]
  - name: PublishPackage
    value: True
             
stages:
  - stage: precommit_self
    dependsOn: []
    jobs:
      - job: self_precommit
        displayName: 'Validate YAML files and check for merge conflicts'
        steps:
          - checkout: self
            path: $(project_name)
          - template: /devops_pipelines/templates/install_and_configure_python.yml
          - script: |
              uv run pre-commit run --all-files --show-diff-on-failure
            displayName: 'Run pre-commit on raptor repo'

  - stage: precommit_package
    dependsOn: []
    jobs:
      - job: package_pipeline
        displayName: 'Call precommit on package_repo and run pre-commit'
        steps:
          - checkout: self
            path: $(project_name)
          - template: /devops_pipelines/templates/create_and_check_package_repo.yml

  - stage: precommit_project
    dependsOn: []
    jobs:
      - job: project_pipeline
        displayName: 'Call precommit on project_repo and run pre-commit'
        steps:
          - checkout: self
            path: $(project_name)
          - template: /devops_pipelines/templates/create_and_check_project_repo.yml

  - stage: tag_release
    dependsOn:
    - precommit_self
    - precommit_package
    - precommit_project
    jobs:
    - job: RunTagRelease
      displayName: Tagging latest release
      steps:
      - template: /.azuredevops/templates/tag_release.yml
        parameters:
          tag_branch: develop
