steps:
  - template: /devops_pipelines/templates/install_and_configure_python.yml
  - script: |
      uv run copier copy -d repo_type=project_repo -d ci_cd=DevOps -d project_name=project_name_ado -f --vcs-ref HEAD --trust . ..
    displayName: 'Call copier on project_repo (DevOps variant)'
  - script: |
      cd ./project_name_ado
      git add .
      uv run --group precommit pre-commit run --all-files --show-diff-on-failure
    displayName: 'Run project_repo own pre-commit config (DevOps variant)'
  - script: |
      uv run copier copy -d repo_type=project_repo -d ci_cd=GitHub -d project_name=project_name_gh -f --vcs-ref HEAD --trust . ..
    displayName: 'Call copier on project_repo (Github variant)'
  - script: |
      cd ./project_name_gh
      git add .
      uv run --group precommit pre-commit run --all-files --show-diff-on-failure
    displayName: 'Run project_repo own pre-commit config (Github variant)'
