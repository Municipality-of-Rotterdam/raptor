# Copier template for Raptor
# Generates either a project repo or a package repo

_subdirectory: ""
_exclude:
  - copier.yaml
  - .copier-answers.yml
  - .envrc
  - .gitignore
  - .gitattributes
  - .gitmodules
  - .pre-commit-config.yaml
  - LICENSE
  - README.md
  - azure-pipelines.yml
  - changelog.md
  - pyproject.toml
  - raptor_logo.png
  - uv.lock
  - .azuredevops
  - .github_raptor
  - .mypy_cache
  - .ruff_cache
  - .taskfile
  - .venv
  - /aml_deployments
  - /devops_pipelines
  - /docs
  - /src
  - /tests
  - .env.example
_env_vars:
  - COPIER_NO_INPUT

project_type:
  type: str
  help: What kind of repo do you want to create?
  choices:
    - project
    - package
  default: project

repo_name:
  type: str
  help: Repository name
  default: my_repo

author_name:
  type: str
  help: Author name
  default: Your Name

author_email:
  type: str
  help: Author email
  default: your@email.com

description:
  type: str
  help: Short description
  default: A short description.

python_version:
  type: str
  help: Python version
  default: "3.11"

uv_version:
  type: str
  help: uv version
  default: "0.10.6"

precommit_version:
  type: str
  help: Pre-commit version
  default: "3.4.0"

ci_cd:
  type: str
  help: CI/CD platform
  choices:
    - DevOps
    - GitHub
  default: GitHub

# --- DevOps-specific questions ---

organisation_name:
  type: str
  help: DevOps organisation name
  default: organisation_name
  when: "{{ ci_cd == 'DevOps' }}"

private_agent_name:
  type: str
  help: DevOps private agent name
  default: private_agent_name
  when: "{{ ci_cd == 'DevOps' }}"

github_service_connection:
  type: str
  help: DevOps service connection for GitHub
  default: github-ci-templates
  when: "{{ ci_cd == 'DevOps' }}"

# --- GitHub-specific questions ---

azure_resource_group:
  type: str
  help: Azure resource group
  default: default_resource_group
  when: "{{ ci_cd == 'GitHub' }}"

azureml_workspace:
  type: str
  help: Azure ML workspace
  default: default_workspace
  when: "{{ ci_cd == 'GitHub' }}"

publish_package_on_public_pypi:
  type: bool
  help: Publish package on public PyPI?
  default: false
  when: "{{ ci_cd == 'GitHub' and project_type == 'package' }}"

create_aml_environment_in_cicd:
  type: bool
  help: Create AML environment in CI/CD?
  default: false
  when: "{{ ci_cd == 'GitHub' and project_type == 'package' }}"

# --- DevOps package-specific ---

package_feed:
  type: str
  help: Package feed name
  default: package_feed
  when: "{{ ci_cd == 'DevOps' and project_type == 'package' }}"

# --- Package-specific questions ---

package_name:
  type: str
  help: Package name (alphanumeric + underscores)
  default: package_name
  when: "{{ project_type == 'package' }}"

project_name:
  type: str
  help: Project name (for PyPI / package feed)
  default: project_name
  when: "{{ project_type == 'package' }}"

# --- Project-specific questions ---

type_deployment:
  type: str
  help: Type of deployment
  choices:
    - none
    - batch
    - online
    - scheduled-pipeline
  default: none
  when: "{{ project_type == 'project' }}"

# --- Computed variables ---

__aml_project_code: "{{ repo_name.lower().replace(' ', '_').replace('-', '_') }}"
__aml_base_deployment_name: "{{ __aml_project_code.replace('_', '-') }}"
__cookiecutter_template_version: "2.1.0"

# --- Post-generation tasks ---

_tasks:
  - |
    export COPIER_PROJECT_TYPE="{{ project_type }}"
    export COPIER_CI_CD="{{ ci_cd }}"
    export COPIER_REPO_NAME="{{ repo_name }}"
    export COPIER_PACKAGE_NAME="{{ package_name }}"
    export COPIER_AUTHOR_NAME="{{ author_name }}"
    export COPIER_AUTHOR_EMAIL="{{ author_email }}"
    {{ _copier_python }} {{ _copier_conf.src_path }}/scripts/post_gen.py

# --- Migrations ---

_migrations: []
